name: Deploy to production
# Production only moves on a release: push a tag like v1.2.0 (or publish a GitHub Release, which
# pushes the tag). Every push to main goes to /beta/ instead — see deploy-beta.yml. A pre-release
# tag (anything with a suffix, like v1.2.0-beta.1) only labels the beta and never deploys here.
on:
  push:
    tags: ["v*", "!v*-*"]
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, ktn]
    # Every run step works in the live service dir. A `cd` in one step does not carry
    # to the next, so set the directory once here. The host nginx serves
    # nonet.kautiontape.com from its dist/ and terminates TLS.
    defaults:
      run:
        working-directory: /opt/services/nonet
    steps:
      # actions/setup-node provisions Node onto PATH for the runner's job working
      # directory. ktn's system Node is 18, too old for Vite 8 / Vitest 5.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check out the release
        # The tagged commit for a release; the chosen ref's commit when run by hand.
        run: |
          git fetch --prune --tags --force origin
          git checkout --force --detach "${{ github.ref_type == 'tag' && format('refs/tags/{0}', github.ref_name) || github.sha }}"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Build last: if the typecheck or the tests fail, the job stops here and the
      # old dist/ stays in place, so a broken build never reaches nginx.
      - name: Build
        run: npm run build
