# nginx site for nonet.kautiontape.com. This file is the source of truth: edit it here and
# install it with deploy/sync-setup.sh (see deploy/README.md), which backs up what was live.
server {
    listen 80;
    listen [::]:80;
    server_name nonet.kautiontape.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nonet.kautiontape.com;
    include snippets/ssl-kautiontape.conf;

    # Nonet (Kautiontape/nonet): its deploy workflow builds dist/ in place.
    root /opt/services/nonet/dist;
    index index.html;

    # Single page; puzzles are picked with ?play=, so no SPA fallback.
    location / {
        try_files $uri $uri/ =404;
    }

    # The page and service worker must revalidate, or Cloudflare's edge and the browser
    # keep serving the previous deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Long-lived caching on hashed asset files (Vite hashes assets/* outputs).
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Sync across devices (docs/design/2026-10-14-cross-device-sync.md): one JSON file per
    # player under /var/lib/nonet-sync, named by the hash of their sync code, read and written
    # through nginx's DAV module. No application code. Only 64-hex names resolve, so nothing
    # else on disk is reachable. Shared by production and /beta/ (same origin). The rate-limit
    # zone is in conf.d/nonet-sync.conf.
    # The regex is quoted because nginx reads a bare {64} as a block brace.
    location ~ "^/api/sync/([0-9a-f]{64})\.json$" {
        alias /var/lib/nonet-sync/$1.json;
        dav_methods PUT DELETE;
        dav_access user:rw group:r;
        limit_except GET PUT DELETE { deny all; }
        client_max_body_size 512k;
        limit_req zone=nonet_sync burst=10 nodelay;
        add_header Cache-Control "no-store" always;
    }

    # Beta (Kautiontape/nonet, every push to main): a second checkout beside production, built in
    # place by deploy-beta.yml. Same caching rules as the root, under /beta/.
    location = /beta {
        return 301 /beta/;
    }
    location /beta/ {
        alias /opt/services/nonet-beta/dist/;
        try_files $uri $uri/ =404;
    }
    location = /beta/index.html {
        alias /opt/services/nonet-beta/dist/index.html;
        add_header Cache-Control "no-cache";
    }
    location = /beta/sw.js {
        alias /opt/services/nonet-beta/dist/sw.js;
        add_header Cache-Control "no-cache";
    }
    location = /beta/manifest.webmanifest {
        alias /opt/services/nonet-beta/dist/manifest.webmanifest;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }
    location /beta/assets/ {
        alias /opt/services/nonet-beta/dist/assets/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
