# Rate limit for Nonet's sync location (sites-available/nonet.kautiontape.com). Cloudflare fronts
# the site, so $binary_remote_addr is the edge's address: key on the client Cloudflare reports,
# falling back to the connection address for anything that reaches the origin directly.
map $http_cf_connecting_ip $nonet_sync_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $nonet_sync_client zone=nonet_sync:1m rate=5r/s;
